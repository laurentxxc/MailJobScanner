llm:
  provider: lmstudio
  endpoint: http://localhost:1234/v1
  model: qwen/qwen3-4b-2507
  api_key: ""
  options:
    temperature: 0.1
    num_predict: 4096

paths:
  cv: data/cv.md
  expectations: data/expectations.md
  db: jobscan.db
  linkedin_cookies: data/private/linkedin_cookies.json

email:
  temp_dir: /tmp/mailjobscan

gmail:
  enabled: false
  email: ""
  app_password: ""             # 16-char App Password, or use ${GMAIL_APP_PASSWORD}
  imap_host: "imap.gmail.com"
  imap_port: 993
  scan_label: "Job Alerts"     # Gmail label to search for job emails
  done_label: "JobScan/Done"   # Gmail label applied after processing
  poll_interval_seconds: 300
