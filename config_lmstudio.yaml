llm:
  provider: lmstudio
  endpoint: http://localhost:1234/v1
  model: qwen/qwen3-4b-2507
  api_key: ""
  options:
    temperature: 0.1
    num_predict: 4096

paths:
  cv: data/cv.md
  expectations: data/expectations.md
  db: jobscan.db
  linkedin_cookies: data/private/linkedin_cookies.json

email:
  temp_dir: /tmp/mailjobscan

gmail:
  enabled: true
  email: "laurentxxc@gmail.com"             # Gmail email address
  app_password: "${GMAIL_APP_PASSWORD}"             # 16-char App Password, or use ${GMAIL_APP_PASSWORD}
  imap_host: "imap.gmail.com"
  imap_port: 993
  scan_label: "RechercheEmploi/JobAlerts"     # Gmail label to search for job emails
  done_label: "RechercheEmploi/ScannedJobs"   # label applied after processing — must NOT be a child of scan_label
                                # (IMAP SELECT returns child labels too, causing re-scans)
  poll_interval_seconds: 300

commute:
  enabled: true
  home_address: "Achères, Yvelines, France"
  api_key: "${OPENROUTESERVICE_API_KEY}"
  profile: "driving-car"       # driving-car, cycling-regular, foot-walking
